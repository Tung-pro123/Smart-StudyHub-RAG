<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(pageTitle, content)" data-theme="light">
<head th:replace="~{fragments/head :: common-head(${pageTitle})}"></head>
<body class="bg-gradient-to-br from-slate-50 via-indigo-50/20 to-purple-50/30 min-h-screen text-base-content flex flex-col">

    <!-- Drawer wrapper: lg:drawer-open keeps vertical navigation sidebar permanently docked on left on desktop -->
    <div class="drawer lg:drawer-open flex-grow">
        <input id="main-drawer" type="checkbox" class="drawer-toggle" />
        
        <div class="drawer-content flex flex-col min-h-screen">
            <!-- Navbar Header -->
            <div th:replace="~{fragments/navbar :: navbar}"></div>

            <!-- Main Page Content Area -->
            <main class="flex-grow container mx-auto px-4 md:px-8 py-8 max-w-7xl">
                <th:block th:replace="${content}"></th:block>
            </main>

            <!-- Footer -->
            <div th:replace="~{fragments/footer :: footer}"></div>
        </div>

        <!-- Vertical Navigation Sidebar (Left side of screen) -->
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </div>

</body>
</html>
