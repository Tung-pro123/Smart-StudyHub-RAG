<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar" class="navbar bg-white/80 backdrop-blur-md sticky top-0 z-40 px-4 md:px-8 border-b border-slate-200/80 shadow-sm">
    <!-- Mobile Drawer Open Button -->
    <div class="flex-none lg:hidden">
        <label for="main-drawer" aria-label="open sidebar" class="btn btn-square btn-ghost text-slate-700">
            <i class="fa-solid fa-bars text-xl"></i>
        </label>
    </div>

    <!-- Mobile Brand Logo (Chỉ hiển thị trên mobile khi sidebar ẩn) -->
    <div class="flex-1 lg:hidden items-center gap-2">
        <a th:href="@{/}" class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-600 via-violet-600 to-pink-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <span class="font-extrabold text-base tracking-tight bg-gradient-to-r from-purple-600 via-violet-600 to-pink-600 bg-clip-text text-transparent">StudyHub</span>
        </a>
    </div>

    <!-- Desktop Title / Breadcrumb (Bên trái của Topbar trên desktop) -->
    <div class="flex-1 hidden lg:flex items-center gap-2">
        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Hệ Thống Học Tập</span>
        <span class="text-slate-300">/</span>
        <h2 class="font-extrabold text-sm text-slate-800">StudyHub AI Dashboard</h2>
    </div>

    <!-- Quick Action Buttons (Bên phải Topbar) -->
    <div class="flex-none flex items-center gap-2.5">
        <!-- Nút Tạo Môn Học Nhanh -->
        <button th:if="${(canCreateCourse == null or canCreateCourse) and (session.currentUser == null or session.currentUser.role != 'ROLE_ADMIN')}" 
                onclick="const m = document.getElementById('modal-create-course'); if(m) m.showModal(); else window.location.href='/courses';" 
                class="btn btn-sm bg-gradient-to-r from-purple-600 via-violet-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white border-none rounded-xl text-xs font-bold shadow-sm shadow-purple-500/20 hidden sm:inline-flex gap-1.5">
            <i class="fa-solid fa-plus text-[11px]"></i> Tạo Môn Mới
        </button>

        <!-- Nút Bảng Giá Nhanh -->
        <button th:if="${session.currentUser == null or session.currentUser.role != 'ROLE_ADMIN'}"
                onclick="const m = document.getElementById('modal-pricing-upgrade'); if(m) m.showModal(); else window.location.href='/courses';" 
                class="btn btn-sm btn-ghost text-slate-600 hover:text-indigo-600 rounded-xl text-xs font-bold hidden md:inline-flex gap-1.5">
            <i class="fa-solid fa-gem text-amber-500 text-[11px]"></i> Gói Cước
        </button>

        <!-- Theme Controller (DaisyUI) -->
        <div class="flex-none ml-1">
            <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm text-slate-600">
                <input type="checkbox" class="theme-controller" value="synthwave" />
                <i class="swap-off fa-solid fa-sun text-amber-500 text-base"></i>
                <i class="swap-on fa-solid fa-moon text-indigo-400 text-base"></i>
            </label>
        </div>

        <!-- User Profile Dropdown -->
        <div class="flex-none ml-1">
            <div th:if="${session.currentUser != null}" class="dropdown dropdown-end">
                <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar ring-2 ring-indigo-500/30">
                    <div class="w-9 h-9 rounded-full">
                        <img th:src="${session.currentUser.avatar != null ? session.currentUser.avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=student'}"
                             alt="Avatar" />
                    </div>
                </div>
                <ul tabindex="0" class="mt-3 z-[1] p-2 shadow-xl menu menu-sm dropdown-content bg-white text-slate-700 rounded-2xl w-56 border border-slate-200">
                    <li class="menu-title px-4 py-2 border-b border-slate-100">
                        <div class="flex items-center justify-between">
                            <span class="font-extrabold text-slate-900 text-xs" th:text="${session.currentUser.fullName}">Tên Người Dùng</span>
                            <span th:if="${session.currentUser.subscriptionTier == 'SQUAD' or session.currentUser.subscriptionTier == 'CAMPUS'}" class="badge badge-info badge-xs text-[9px] font-bold">SQUAD</span>
                            <span th:if="${session.currentUser.subscriptionTier == 'PRO' and session.currentUser.subscriptionTier != 'SQUAD' and session.currentUser.subscriptionTier != 'CAMPUS'}" class="badge badge-secondary badge-xs text-[9px] font-bold">PRO</span>
                            <span th:if="${session.currentUser.subscriptionTier == null or session.currentUser.subscriptionTier == 'FREE'}" class="badge badge-ghost badge-xs text-[9px]">FREE</span>
                        </div>
                        <span class="text-[10px] text-slate-400 font-mono" th:text="'@' + ${session.currentUser.username}">@username</span>
                    </li>
                    <li><a th:href="@{/profile}"><i class="fa-solid fa-user text-indigo-500"></i> Hồ Sơ Cá Nhân</a></li>
                    <li th:if="${session.currentUser.role == 'ROLE_ADMIN'}"><a th:href="@{/admin/dashboard}"><i class="fa-solid fa-chart-line text-purple-600"></i> Quản Trị Admin</a></li>
                    <li th:if="${session.currentUser.role != 'ROLE_ADMIN' and !session.currentUser.isPro()}"><a href="javascript:void(0)" onclick="const m = document.getElementById('modal-pricing-upgrade'); if(m) m.showModal(); else window.location.href='/courses';" class="text-purple-600 font-bold"><i class="fa-solid fa-bolt text-amber-500"></i> Nâng Cấp Gói Pro</a></li>
                    <li th:if="${session.currentUser.role == 'ROLE_ADMIN'}"><a th:href="@{/admin/settings}"><i class="fa-solid fa-key text-purple-500"></i> Cài Đặt Hệ Thống</a></li>
                    <li class="border-t border-slate-100 mt-1 pt-1">
                        <a th:href="@{/logout}" class="text-rose-600 hover:bg-rose-50"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng Xuất</a>
                    </li>
                </ul>
            </div>

            <div th:unless="${session.currentUser != null}">
                <a th:href="@{/login}" class="btn btn-sm btn-primary rounded-xl text-xs font-bold shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Đăng Nhập
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('studyhub_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            const toggle = document.querySelector('.theme-controller');
            if (toggle) {
                toggle.checked = (savedTheme === 'synthwave');
                toggle.addEventListener('change', function(e) {
                    const theme = e.target.checked ? 'synthwave' : 'light';
                    document.documentElement.setAttribute('data-theme', theme);
                    localStorage.setItem('studyhub_theme', theme);
                });
            }
        })();
    </script>
</div>
</body>
</html>
