<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="drawer-side z-50">
    <label for="main-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <aside class="bg-base-200 min-h-screen w-80 p-6 flex flex-col justify-between shadow-2xl border-r border-base-300">
        <div>
            <!-- Sidebar Header -->
            <div class="flex items-center gap-3 pb-6 border-b border-base-300">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-graduation-cap text-lg"></i>
                </div>
                <div>
                    <h3 class="font-extrabold text-lg text-base-content">StudyHub AI</h3>
                    <p class="text-xs text-base-content/60">Smart Multi-Course Platform</p>
                </div>
            </div>

            <!-- Navigation Menu -->
            <ul class="menu p-0 mt-6 gap-1">
                <li class="menu-title text-xs uppercase tracking-wider font-bold text-base-content/50">Hệ Sinh Thái Học Tập</li>
                <li>
                    <a th:href="@{/}" class="active:bg-indigo-600 font-semibold py-3">
                        <i class="fa-solid fa-layer-group text-indigo-500 w-5"></i> Quản Lý Môn Học
                    </a>
                </li>
                <li>
                    <a th:href="@{/planner}" class="font-semibold py-3">
                        <i class="fa-solid fa-calendar-check text-emerald-500 w-5"></i> Lịch Học Vừa Sức
                        <span class="badge badge-sm badge-success text-white">Module 4</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/quiz}" class="font-semibold py-3">
                        <i class="fa-solid fa-list-check text-amber-500 w-5"></i> Luyện Đề Trắc Nghiệm
                        <span class="badge badge-sm badge-warning text-white">Module 5</span>
                    </a>
                </li>
                <li>
                    <a th:href="@{/settings}" class="font-semibold py-3">
                        <i class="fa-solid fa-key text-purple-500 w-5"></i> Cài Đặt API Key
                        <span class="badge badge-sm badge-outline">Module 3</span>
                    </a>
                </li>

                <li class="menu-title mt-6 text-xs uppercase tracking-wider font-bold text-base-content/50">Quản Trị Hệ Thống</li>
                <li>
                    <a th:href="@{/h2-console}" target="_blank" class="font-semibold py-3 text-slate-500">
                        <i class="fa-solid fa-database w-5 text-indigo-400"></i> H2 Database Console
                    </a>
                </li>
            </ul>
        </div>

        <!-- Sidebar Footer -->
        <div class="pt-6 border-t border-base-300">
            <div class="bg-base-100/60 rounded-2xl p-4 border border-base-300/80">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-600 flex items-center justify-center font-bold text-xs">
                        <i class="fa-solid fa-bolt"></i>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-base-content">Gemini 1.5 & Groq</p>
                        <p class="text-[11px] text-base-content/60">Cloud Embedding 768d</p>
                    </div>
                </div>
            </div>
        </div>
    </aside>
</div>
</body>
</html>
