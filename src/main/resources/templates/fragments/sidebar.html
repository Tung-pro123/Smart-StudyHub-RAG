<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="sidebar" class="drawer-side z-50">
    <label for="main-drawer" aria-label="close sidebar" class="drawer-overlay"></label>
    <aside class="bg-white/95 backdrop-blur-xl min-h-screen w-64 lg:w-64 p-5 flex flex-col justify-between shadow-sm border-r border-slate-200/80 text-slate-800">
        <div class="space-y-6">
            <div class="flex items-center gap-3 pb-5 border-b border-slate-100">
                <a th:href="@{/}" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-purple-600 via-violet-600 to-pink-600 flex items-center justify-center text-white shadow-md shadow-purple-500/20 group-hover:scale-105 transition-transform">
                        <i class="fa-solid fa-graduation-cap text-lg"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-purple-600 via-violet-600 to-pink-600 bg-clip-text text-transparent">StudyHub AI</span>
                    </div>
                </a>
            </div>

            <div class="space-y-4">
                <th:block th:if="${session.currentUser != null and session.currentUser.role == 'ROLE_ADMIN'}">
                    <div>
                        <p class="px-3 text-[11px] font-black uppercase tracking-wider text-purple-600 mb-1.5">Quản Trị Admin</p>
                        <ul class="menu p-0 gap-1 text-xs font-bold text-slate-700">
                            <li>
                                <a th:href="@{/admin/dashboard}" class="py-2.5 px-3 rounded-xl hover:bg-purple-50 hover:text-purple-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-chart-line text-purple-600 text-sm w-5 text-center"></i>
                                    <span>Command Center</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/admin/users}" class="py-2.5 px-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-users text-indigo-600 text-sm w-5 text-center"></i>
                                    <span>Quản Lý Sinh Viên</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/courses}" class="py-2.5 px-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-book-open text-indigo-600 text-sm w-5 text-center"></i>
                                    <span>Quản Lý Môn Học</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/admin/settings}" class="py-2.5 px-3 rounded-xl hover:bg-amber-50 hover:text-amber-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-key text-amber-500 text-sm w-5 text-center"></i>
                                    <span>Cấu Hình AI Key</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </th:block>

                <th:block th:unless="${session.currentUser != null and session.currentUser.role == 'ROLE_ADMIN'}">
                    <div>
                        <p class="px-3 text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1.5">Không Gian Học Tập</p>
                        <ul class="menu p-0 gap-1 text-xs font-bold text-slate-700">
                            <li>
                                <a th:href="@{/courses}" class="py-2.5 px-3 rounded-xl hover:bg-indigo-50 hover:text-indigo-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-book-open text-indigo-600 text-sm w-5 text-center"></i>
                                    <span>Quản Lý Môn Học</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/planner}" class="py-2.5 px-3 rounded-xl hover:bg-emerald-50 hover:text-emerald-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-calendar-check text-emerald-600 text-sm w-5 text-center"></i>
                                    <span>Lịch Học</span>
                                </a>
                            </li>
                            <li>
                                <a th:href="@{/quiz}" class="py-2.5 px-3 rounded-xl hover:bg-amber-50 hover:text-amber-700 transition-all flex items-center gap-3">
                                    <i class="fa-solid fa-list-check text-amber-600 text-sm w-5 text-center"></i>
                                    <span>Luyện Đề Trắc Nghiệm</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </th:block>

                <div>
                    <p class="px-3 text-[11px] font-black uppercase tracking-wider text-slate-400 mb-1.5">Tiện Ích</p>
                    <ul class="menu p-0 gap-1 text-xs font-bold text-slate-700">
                        <li>
                            <a th:href="@{/pricing}"
                               class="py-2.5 px-3 rounded-xl hover:bg-pink-50 hover:text-pink-700 transition-all flex items-center gap-3 w-full text-left">
                                <i class="fa-solid fa-gem text-pink-500 text-sm w-5 text-center"></i>
                                <span>Bảng Giá Gói Cước</span>
                            </a>
                        </li>
                        <li th:if="${session.currentUser != null and session.currentUser.role == 'ROLE_ADMIN'}">
                            <a th:href="@{/h2-console}" target="_blank" class="py-2.5 px-3 rounded-xl hover:bg-slate-100 hover:text-slate-900 transition-all flex items-center gap-3">
                                <i class="fa-solid fa-database text-slate-400 text-sm w-5 text-center"></i>
                                <span>H2 Database Console</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="pt-5 border-t border-slate-100 space-y-3">
            <div th:if="${session.currentUser != null}" class="p-3 rounded-2xl bg-slate-50 border border-slate-200/70 flex items-center gap-3">
                <img th:src="${session.currentUser.avatar != null ? session.currentUser.avatar : 'https://api.dicebear.com/7.x/bottts/svg?seed=student'}" 
                     class="w-10 h-10 rounded-xl border border-indigo-200 bg-white object-cover" alt="Avatar" />
                <div class="min-w-0 flex-1">
                    <p class="text-xs font-extrabold text-slate-900 truncate" th:text="${session.currentUser.fullName}">Sinh Viên</p>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span th:if="${session.currentUser.role == 'ROLE_ADMIN'}" class="badge badge-xs bg-purple-100 text-purple-700 font-black border-none text-[9px]">ADMIN</span>
                        <span th:if="${session.currentUser.subscriptionTier == 'PRO' and session.currentUser.role != 'ROLE_ADMIN'}" class="badge badge-xs bg-pink-100 text-pink-700 font-black border-none text-[9px]">PRO</span>
                        <span th:if="${session.currentUser.subscriptionTier == null or session.currentUser.subscriptionTier == 'FREE'}" class="badge badge-xs bg-slate-200 text-slate-700 font-bold border-none text-[9px]">FREE</span>
                        <span class="text-[10px] text-slate-400 font-mono truncate" th:text="'@' + ${session.currentUser.username}">@user</span>
                    </div>
                </div>
            </div>
            
            <div th:unless="${session.currentUser != null}">
                <a th:href="@{/login}" class="btn btn-sm btn-primary w-full rounded-xl text-xs font-bold shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Đăng Nhập
                </a>
            </div>
        </div>
    </aside>
</div>
</body>
</html>
