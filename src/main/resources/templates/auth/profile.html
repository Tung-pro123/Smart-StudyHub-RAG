<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: main-layout(
        'Hồ Sơ Cá Nhân - StudyHub AI',
        ~{::section}
      )}">
<body>
<section class="max-w-2xl mx-auto my-6 space-y-6">

    <!-- Profile Header Card -->
    <div class="glass-card rounded-3xl p-8 shadow-xl border border-white/20 relative overflow-hidden">
        <div class="flex flex-col sm:flex-row items-center gap-6 relative z-10">
            <div class="avatar">
                <div class="w-24 h-24 rounded-3xl ring ring-primary ring-offset-base-100 ring-offset-2 overflow-hidden shadow-lg shadow-indigo-500/20">
                    <img th:src="${user.avatar}" alt="Avatar Sinh Viên" />
                </div>
            </div>
            <div class="space-y-1 text-center sm:text-left flex-1">
                <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                    <h2 class="text-2xl font-black text-base-content" th:text="${user.fullName}">Nguyễn Văn Sinh Viên</h2>
                    <span class="badge badge-primary font-bold text-xs" th:text="${user.role}">ROLE_STUDENT</span>
                </div>
                <p class="text-xs text-base-content/60 font-mono" th:text="'@' + ${user.username}">@student</p>
                <p class="text-xs text-base-content/70 flex items-center justify-center sm:justify-start gap-1.5 pt-1">
                    <i class="fa-solid fa-envelope text-indigo-500"></i>
                    <span th:text="${user.email}">student@fpt.edu.vn</span>
                </p>
            </div>
            <div>
                <a th:href="@{/logout}" class="btn btn-sm btn-outline border-rose-400 text-rose-500 hover:bg-rose-500 hover:text-white rounded-xl text-xs font-bold">
                    <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i> Đăng Xuất
                </a>
            </div>
        </div>
        <!-- Decorative Glow -->
        <div class="absolute -right-16 -bottom-16 w-56 h-56 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>
    </div>

    <!-- Security & JWT Status Card -->
    <div class="glass-card rounded-3xl p-6 shadow-sm border border-base-200 space-y-4">
        <h3 class="font-extrabold text-base text-base-content flex items-center gap-2">
            <i class="fa-solid fa-shield-halved text-emerald-500"></i> Trạng Thái Bảo Mật & JWT Token
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div class="bg-base-100/50 p-4 rounded-2xl border border-base-200">
                <p class="text-base-content/60 font-semibold">Thuật toán băm mật khẩu:</p>
                <p class="font-bold text-emerald-600 mt-1">BCrypt 10 Rounds</p>
            </div>
            <div class="bg-base-100/50 p-4 rounded-2xl border border-base-200">
                <p class="text-base-content/60 font-semibold">Định dạng xác thực:</p>
                <p class="font-bold text-indigo-600 mt-1">JWT (HS256) HttpOnly Cookie</p>
            </div>
            <div class="bg-base-100/50 p-4 rounded-2xl border border-base-200">
                <p class="text-base-content/60 font-semibold">Thời hạn phiên đăng nhập:</p>
                <p class="font-bold text-base-content mt-1">24 Giờ (Tự động gia hạn)</p>
            </div>
            <div class="bg-base-100/50 p-4 rounded-2xl border border-base-200">
                <p class="text-base-content/60 font-semibold">Ngày tham gia hệ thống:</p>
                <p class="font-bold text-base-content mt-1" th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">18/10/2026</p>
            </div>
        </div>
    </div>

</section>
</body>
</html>
