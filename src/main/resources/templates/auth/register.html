<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: main-layout(
        'Đăng Ký Tài Khoản - StudyHub AI',
        ~{::section}
      )}">
<body>
<section class="max-w-md mx-auto my-8 space-y-6">

    <!-- Flash Messages -->
    <div th:if="${errorMessage}" class="alert alert-error shadow-lg rounded-2xl flex items-center justify-between text-white border-none bg-rose-600">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
            <span class="font-bold text-xs md:text-sm" th:text="${errorMessage}">Đã xảy ra lỗi!</span>
        </div>
        <button onclick="this.parentElement.remove()" class="btn btn-ghost btn-circle btn-xs text-white">✕</button>
    </div>

    <!-- Register Card Glassmorphism -->
    <div class="glass-card rounded-3xl p-8 shadow-2xl border border-white/20 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-600 text-white flex items-center justify-center font-bold text-2xl mx-auto shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-black text-base-content tracking-tight">Đăng Ký Tài Khoản</h2>
        </div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post" class="space-y-4">
            <div class="form-control">
                <label class="label py-1"><span class="label-text font-bold text-xs">Họ và Tên</span></label>
                <div class="relative">
                    <i class="fa-solid fa-id-card absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-xs"></i>
                    <input type="text" th:field="*{fullName}" required placeholder="Nguyễn Văn A" 
                           class="input input-bordered pl-9 w-full rounded-xl text-xs" />
                </div>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-bold text-xs">Tên Đăng Nhập (Username) *</span></label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-xs"></i>
                    <input type="text" th:field="*{username}" required placeholder="nguyenvana" 
                           class="input input-bordered pl-9 w-full rounded-xl text-xs lowercase" />
                </div>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-bold text-xs">Email FPT / Cá Nhân *</span></label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-xs"></i>
                    <input type="email" th:field="*{email}" required placeholder="vana@fpt.edu.vn" 
                           class="input input-bordered pl-9 w-full rounded-xl text-xs" />
                </div>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-bold text-xs">Mật Khẩu *</span></label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-xs"></i>
                    <input type="password" th:field="*{password}" required placeholder="Tối thiểu 6 ký tự" 
                           class="input input-bordered pl-9 w-full rounded-xl text-xs" />
                </div>
            </div>

            <div class="form-control">
                <label class="label py-1"><span class="label-text font-bold text-xs">Nhập Lại Mật Khẩu *</span></label>
                <div class="relative">
                    <i class="fa-solid fa-shield absolute left-3 top-1/2 -translate-y-1/2 text-base-content/40 text-xs"></i>
                    <input type="password" th:field="*{confirmPassword}" required placeholder="Nhập lại mật khẩu trên" 
                           class="input input-bordered pl-9 w-full rounded-xl text-xs" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-full rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 border-none text-white shadow-lg shadow-emerald-500/20 mt-2">
                <i class="fa-solid fa-user-check mr-1"></i> Hoàn Tất Đăng Ký
            </button>
        </form>

        <!-- Divider: Hoặc đăng ký nhanh với -->
        <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-px bg-base-300"></div>
            <span class="text-xs text-base-content/50 font-medium">Hoặc đăng ký nhanh với</span>
            <div class="flex-1 h-px bg-base-300"></div>
        </div>

        <!-- Google OAuth2 Register Button -->
        <div class="space-y-3">
            <a th:href="@{/oauth2/authorization/google}"
               class="btn btn-outline w-full border-base-300 hover:bg-white hover:border-red-500 hover:text-red-500 rounded-xl text-xs font-bold h-12">
                <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Đăng ký với Google
            </a>
        </div>

        <div class="text-center text-xs text-base-content/60">
            Đã có tài khoản? 
            <a th:href="@{/login}" class="font-bold text-primary hover:underline ml-1">Đăng nhập tại đây</a>
        </div>
    </div>

</section>
</body>
</html>
