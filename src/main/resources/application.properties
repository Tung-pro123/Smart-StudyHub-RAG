spring.application.name=Smart Multi-Course Study Hub & RAG AI
server.port=8080

# ==========================================
# CẤU HÌNH H2 DATABASE (LƯU RA FILE BỀN VỮNG)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/studyhubdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bật trang web quản trị H2 Web Console tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CẤU HÌNH THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==========================================
# CẤU HÌNH UPLOAD FILE PDF (MAX 25MB)
# ==========================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
