spring.application.name=Smart Multi-Course Study Hub & RAG AI
studyhub.ai.gemini-api-key[GCPI_API_KE]}
server.port=8080

# ==========================================
# CẤU HÌNH H2 DATABASE (LƯU RA FILE BỀN VỮNG)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/studyhubdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Bật trang web quản trị H2 Web Console tại: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==========================================
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CẤU HÌNH THYMELEAF
# ==========================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==========================================
# CẤU HÌNH UPLOAD FILE PDF (MAX 25MB)
# ==========================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ==========================================
# CẤU HÌNH GOOGLE OAUTH2
# ==========================================
# Link tạo OAuth2 Client: https://console.cloud.google.com/apis/credentials
# Hỗ trợ tự động đọc từ file .env hoặc biến môi trường GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
spring.config.import=optional:file:./.env[.properties]
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub


# ==========================================
# CẤU HÌNH CENTRALIZED SYSTEM AI KEY & LLM ROTATOR
# ==========================================
studyhub.ai.gemini-api-keys=${GEMINI_API_KEYS:${GEMINI_API_KEY:}}
studyhub.ai.base-url=${LITELLM_BASE_URL:}
studyhub.ai.model=gemini-2.5-flash
